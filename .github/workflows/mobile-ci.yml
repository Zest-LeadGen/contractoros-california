name: contractoros-mobile-ci

# H6-B.1: mobile dependency/static validation (issue #64 items 5-6, mobile
# half). Deterministic install from the committed lockfile plus static
# config validation — no emulator/device layers (tracked, blocked per the
# TOOLCHAIN.md test-layer ledger). Advisory until the owner wires required
# checks (H6-B ruleset act).

# H6-B.1: pull_request path filters removed so this context can be a
# REQUIRED check — a path-filtered required check blocks every PR that
# doesn't touch its paths (stays 'expected' forever). Cost: ~23s per PR.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".nvmrc"
      - ".github/workflows/mobile-ci.yml"

permissions:
  contents: read

# H7A-4 (#137, PA-0025): full-SHA action pins (resolved live 2026-08-10),
# bounded timeout, concurrency, persist-credentials:false.
concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-install:
    name: Mobile install + static validation from lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Registry provenance check
        run: |
          test "$(npm config get registry)" = "https://registry.npmjs.org/"
          test ! -f .npmrc

      - name: Clean install from lockfile only
        run: npm ci --no-audit --no-fund

      - name: Lockfile drift check
        run: git diff --exit-code package.json package-lock.json

      - name: Lint (mandatory since H6 closeout)
        run: npm run lint

      - name: Unit tests + coverage (mandatory since H6 closeout)
        run: npm run test:coverage

      - name: Expo config static validation
        env:
          EXPO_NO_TELEMETRY: "1"
          CI: "1"
        run: npx expo config --type public > /dev/null

      - name: Entry module resolves
        run: node -e "require.resolve('./App.js')"
