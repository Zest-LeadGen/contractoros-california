name: contractoros-codeql

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "19 6 * * 1"

permissions:
  contents: read
  security-events: write

# H7A-4 (#137, PA-0025): full-SHA action pins, bounded timeout, concurrency,
# persist-credentials:false. SHAs resolved live 2026-08-10 (checkout v4 ->
# 11d5960a; codeql-action v3 annotated tag dereferenced -> c4dd10e4).
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3
